services:
  # Backend Web Service (FastAPI)
  - type: web
    name: fluencycast-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fluencycast-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  # Managed PostgreSQL Database on Render
  - name: fluencycast-db
    databaseName: fluency_cast
    user: fluency_user
    plan: free
